name: Update menu feeds

on:
  schedule:
    # 04:00 UTC daily — 06:00/07:00 Finnish time, before anyone checks the app.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run test suite
        run: python -m unittest discover -s tests -t .

      - name: Scrape and render feeds
        id: build
        continue-on-error: true
        run: python -m kastelli_menu.build

      - name: Commit updated feeds
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --staged --quiet; then
            echo "No menu changes."
          else
            git commit -m "Update menu feeds"
            git push
          fi

      - name: Fail if the source page could not be parsed
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::Scrape reported warnings — the ISS page markup may have changed."
          exit 1
